[package]
name = "dallr-studio"
version = "0.1.0"
description = "Dallr Studio — desktop interface preview for a Decart Lucy 2.5 workflow"
authors = ["Dallr Studio"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dallr_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
